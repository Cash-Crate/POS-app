name: Deploy Backend

on:
  push:
    branches:
      - test-branch
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          set -e
          cd server
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          set -e
          cd server
          source venv/bin/activate
          python manage.py test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to AWS ECR
        run: |
          set -e
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          set -e
          docker build -t 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest -f server/Dockerfile server/
          docker push 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest

      - name: Deploy to EC2 using Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/POS-app/server
            git checkout test-branch
            git pull origin test-branch
            
            # Pull latest Docker image
            docker pull 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest
            
            # Stop and remove existing containers
            docker-compose down
            
            # Start updated containers in detached mode
            docker-compose up -d --force-recreate --remove-orphans
            
            # Restart Nginx
            sudo systemctl restart nginx
