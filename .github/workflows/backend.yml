name: Deploy Backend

on:
  push:
    branches:
      - test-branch
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          set -e
          cd server
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          set -e
          cd server
          source venv/bin/activate
          python manage.py test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Log in to AWS ECR
        run: |
          set -e
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and tag Docker image
        run: |
          set -e
          docker build -t server -f server/Dockerfile server/
          docker tag server:latest 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest

      - name: Push image to AWS ECR
        run: |
          set -e
          docker push 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/POS-app/server
            git checkout test-branch
            git pull origin test-branch
            docker pull 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest
            
            # Stop and remove any existing container using port 8000
            RUNNING_CONTAINER=$(docker ps --filter "name=server" --format "{{.ID}}")
            if [ ! -z "$RUNNING_CONTAINER" ]; then
              docker stop $RUNNING_CONTAINER
              docker rm $RUNNING_CONTAINER
            fi
            
            # Run new container
            docker run -d -p 8000:8000 --name server 891377178047.dkr.ecr.ap-southeast-1.amazonaws.com/server:latest
            
            # Restart Nginx if necessary
            sudo systemctl restart nginx
